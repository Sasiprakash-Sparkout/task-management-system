<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../images/icon/dash.jpg">
    <link rel="stylesheet" href="../css/das.css">
    <title>Dashboard</title>
    <script defer src="../javascript/dashboard.js"></script>
</head>

<body>
    <header>
        <div>
            <h2>Dashboard Task Management</h2>


        </div>
    </header>
    <div class="task">
        <div class="nm-task">
            <h3>Total task</h3>
            <p id="total-task">0</p>
        </div>

        <div class="com-task">
            <h3>Task completed</h3>
            <p id="completed-task">0</p>
        </div>

        <div class="pending">
            <h3>Pending task</h3>
            <p id="pending-task">0</p>
        </div>
    </div>
    <div class="search">
        <input type="search" id="search" placeholder="To search tasks">

        <select id="filter">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
        </select>
        <select id="selectpriority">
    <option value="">filter by priority</option>
    <option value="high">high</option>
    <option value="medium">medium</option>
    <option value="low">low</option>
   
</select>
<select id="selectdate">
    <option value="">filter by date</option>
    <option value="created date">created date</option>
    <option value="due date">pending date</option>
  
   
</select>
        <a href="./addtask.html" id="addtask">Add Task</a>
    </div>
    <div class="tasklist">
        <h2>Task</h2>

        <div id="task-container">

        </div>
    </div>
</body>

</html>
