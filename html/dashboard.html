<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../images/icon/dash.jpg">
    <link rel="stylesheet" href="../css/das.css">
    <title>Dashboard</title>
    <script defer src="../javascript/dashboard.js"></script>
</head>

<body>
    <header>
        <div>
            <h2>Dashboard Task Management</h2>

        <a href="./addtask.html" id="addtask">Add Task</a>

        </div>
    </header>
    <div class="task">
        <div class="nm-task">
            <h3>Total task</h3>
            <p id="total-task">0</p>
        </div>

        <div class="com-task">
            <h3>Task completed</h3>
            <p id="completed-task">0</p>
        </div>

        <div class="pending">
            <h3>Pending task</h3>
            <p id="pending-task">0</p>
        </div>
    </div>
    <div class="search">
        <input type="search" id="search" placeholder="To search tasks by title or description">
<label for="filter">Filter Task:</label>
        <select id="filter">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
        </select>
        <label for="sort-by">Sort By:</label>
<select id="sort-by">
    <option value="dueDate">Due Date</option>
    <option value="priority">Priority</option>
</select>

<label for="sort-order">Order:</label>
<select id="sort-order">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
</select>

    
    </div>
    <div class="tasklist">
        <h2>Task</h2>
        <p id="empty"> No tasks available. <b>Click Add Task</b> to create your first task.</p>

        <div id="task-container">
            
        </div>
    </div>
</body>

</html>
